<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Eveentia - Iniciar Sesión</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/dashboard/css/login.css">
    
    <!-- Configuración Global -->
    <script src="/public/config.js"></script>
</head>
<body class="bg-background text-on-background font-sans min-h-screen flex flex-col">
    <!-- TopAppBar Component -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 w-full h-20 z-40 shadow-sm shadow-pink-900/5">
        <div class="flex justify-between items-center px-8 py-4 h-full">
            <div class="text-2xl font-serif font-bold text-pink-600 tracking-tight">
                Eveentia
            </div>
            <div class="flex items-center gap-4">
                <button class="bg-pink-600 text-white px-6 py-2 rounded-lg text-label-sm uppercase font-semibold cursor-pointer active:scale-95 transition-all duration-200">
                    Registrarse
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content: Login Section -->
    <main class="flex-grow relative flex items-center justify-center pt-12 pb-20">
        <!-- Background: Subtle Editorial Texture -->
        <div class="absolute inset-0 z-0 overflow-hidden bg-surface-container-low">
            <div class="absolute inset-0 bg-gradient-to-tr from-pink-50/30 via-transparent to-pink-50/20 z-10"></div>
            <div class="w-full h-full opacity-10 mix-blend-overlay" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD-H9Fe8bp3B9XjWhBvgYWH3Ps2DHjS2S2ql9xtnMxcmviBLdAoP7QKswcOiG5QRDgwwbSB9AMRgjmjhMgF3-2yn5Q66CY7OLT-SvUSYw6sV2xNYzqF-szt2FKPt5onAfTWha0ZP9TlTYcGxVp96YMg4P8rcfid0RyZPaGepSh0p3k97BhYoORYqiN0YyGKlV0BIk7eIen9iqhq6OzWJIPHLdIoP6uM_SQuFJymaLJB79abOdYPxhSxa9jUNzMilq6Hle59Rs9xeIkw')"></div>
        </div>

        <!-- Login Container -->
        <div class="relative z-20 w-full max-w-md px-6">
            <div class="editorial-panel p-10 rounded-xl shadow-xl shadow-gray-200/50">
                <div class="text-center mb-10">
                    <h1 class="font-serif text-h2 text-on-background mb-3">Bienvenido de nuevo</h1>
                    <p class="text-on-surface-variant font-body-md">Ingresa tus credenciales para continuar</p>
                </div>

                <form class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-label-sm text-on-surface-variant uppercase tracking-wider font-semibold" for="email">Correo electrónico</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
                            <input class="w-full bg-white border border-outline-variant text-on-surface px-10 py-3.5 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline/40 outline-none" id="email" placeholder="nombre@ejemplo.com" type="email" required/>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="block text-label-sm text-on-surface-variant uppercase tracking-wider font-semibold" for="password">Contraseña</label>
                        </div>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
                            <input class="w-full bg-white border border-outline-variant text-on-surface px-10 py-3.5 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline/40 outline-none" id="password" placeholder="••••••••" type="password" required/>
                        </div>
                    </div>

                    <div class="flex items-center justify-end">
                        <a class="text-sm text-primary font-medium hover:underline transition-colors" href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-4 rounded-lg shadow-lg shadow-pink-200 transition-all active:scale-[0.98] uppercase tracking-widest text-sm" type="submit">
                        Iniciar sesión
                    </button>
                </form>

                <div class="relative my-10">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-outline-variant/60"></div>
                    </div>
                    <div class="relative flex justify-center text-xs uppercase tracking-widest">
                        <span class="bg-white px-4 text-outline font-medium">o continúa con</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-2 w-full bg-white border border-outline-variant hover:bg-surface-container-high transition-colors text-on-surface-variant py-3 rounded-lg text-sm font-medium active:scale-[0.98]">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                        </svg>
                        <span>Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-2 w-full bg-white border border-outline-variant hover:bg-surface-container-high transition-colors text-on-surface-variant py-3 rounded-lg text-sm font-medium active:scale-[0.98]">
                        <svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
                        </svg>
                        <span>Facebook</span>
                    </button>
                </div>

                <div class="mt-10 text-center">
                    <p class="text-sm text-on-surface-variant">
                        ¿No tienes una cuenta? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Regístrate</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 relative w-full bottom-0">
        <div class="flex flex-col md:flex-row justify-between items-center py-10 px-8 max-w-7xl mx-auto gap-8">
            <div class="text-xl font-serif font-black text-gray-900 tracking-tight">Eveentia Editorial</div>
            <div class="flex flex-wrap justify-center gap-8">
                <a class="text-xs font-semibold uppercase tracking-widest text-gray-400 hover:text-pink-600 transition-colors" href="#">Política de Privacidad</a>
                <a class="text-xs font-semibold uppercase tracking-widest text-gray-400 hover:text-pink-600 transition-colors" href="#">Términos de Servicio</a>
                <a class="text-xs font-semibold uppercase tracking-widest text-gray-400 hover:text-pink-600 transition-colors" href="#">Soporte</a>
                <a class="text-xs font-semibold uppercase tracking-widest text-gray-400 hover:text-pink-600 transition-colors" href="#">Contacto</a>
            </div>
            <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-300">
                © 2026 Eveentia Management.
            </div>
        </div>
    </footer>

    <!-- Custom Scripts -->
    <script src="/dashboard/js/login.js"></script>
</body>
</html>
